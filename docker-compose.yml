services:
  game:
    image: yeahscience/htmx-flappybird:latest
    ports:
      - 3200:3200
    build:
      context: ./
      dockerfile: Dockerfile
    platform: "linux/amd64"

    volumes:
      - ./data:/data
    environment:
      - ENVIRONMENT=production
    tty: true
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 300M

